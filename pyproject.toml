[project]
name = "dating-api"
version = "0.1.0"
description = "FastAPI backend for a dating app"
authors = [
    { name = "TyPaporotnyk", email = "daniil.svadkovsky@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120,<0.121",
    "uvicorn>=0.38,<0.39",
    "alembic (>=1.17.0,<2.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "dishka (>=1.7.2,<2.0.0)",
    "pydantic[email] (>=2.12.3,<3.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "passlib[argon2] (>=1.7.4,<2.0.0)",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
    "ruff>=0.9.4",
    "mypy>=1.14",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "I", "UP", "SIM", "RUF"]
ignore = ["D203", "D212", "UP035"]
unfixable = ["F401", "F841"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D101", "D103"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "dating", from = "src" }]
