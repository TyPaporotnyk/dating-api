stages:
  - lint
  - build

lint_app:
  stage: lint
  image: python:3.13
  before_script:
    - pip install pre-commit
  script:
    - pre-commit run --all-files
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'


build_app:
  stage: build
  image: docker:25.0.5
  services:
    - docker:25.0.5-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t 'dating-api-image' -f ./Dockerfile .
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
